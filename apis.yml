    type: Documentation
  description: >-
    The Midjourney Discord Bot is the original interface for accessing Midjourney's AI image generation
    service. Users interact with the bot through Discord slash commands such as /imagine, /blend, /describe,
    and /shorten to generate and manipulate AI-created images. The bot supports features including text-to-image
    generation, image upscaling, variation creation, and image blending, all within the Discord messaging
    platform.
